<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex WhatsApp - Disparos em Massa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .method-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .method-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .method-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .method-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .phone-input-group {
            display: flex;
            gap: 10px;
        }

        .phone-input-group input {
            flex: 1;
        }

        .btn-add {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .btn-add:hover {
            background: #5568d3;
        }

        .phone-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            background: #f9f9f9;
            border-radius: 5px;
            padding: 10px;
        }

        .phone-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            margin: 5px 5px 5px 0;
            font-size: 0.9em;
        }

        .phone-tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            margin-left: 8px;
            font-size: 1.2em;
            line-height: 1;
            padding: 0;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status-section {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .status-card h3 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .status-card .number {
            font-size: 2em;
            font-weight: bold;
        }

        .campaigns-list {
            margin-top: 20px;
        }

        .campaign-item {
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #667eea;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .campaign-item .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #333;
        }

        .campaign-item .id {
            font-weight: 600;
            color: #667eea;
        }

        .campaign-item .method {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .campaign-item .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-processing {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .campaign-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            font-size: 0.9em;
        }

        .campaign-detail {
            background: white;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .campaign-detail .label {
            color: #666;
            font-weight: 600;
            font-size: 0.8em;
        }

        .campaign-detail .value {
            color: #667eea;
            font-size: 1.2em;
            font-weight: bold;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .status-section {
                grid-template-columns: repeat(2, 1fr);
            }

            .campaign-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Vortex WhatsApp</h1>
            <p>Sistema de Disparos em Massa via Zernio API</p>
        </div>

        <div class="main-grid">
            <!-- Formulário de Campanha -->
            <div class="card">
                <h2>📝 Nova Campanha</h2>

                <div id="alert-container"></div>

                <div class="form-group">
                    <label>Método de Envio</label>
                    <div class="method-selector">
                        <button class="method-btn active" data-method="oficial">
                            ✅ Oficial (Zernio)
                        </button>
                        <button class="method-btn" data-method="qrcode">
                            📱 QR Code
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="instance-id">ID da Instância</label>
                    <input
                        type="text"
                        id="instance-id"
                        value="prof_123"
                        placeholder="prof_123"
                    />
                </div>

                <div class="form-group">
                    <label for="message">Mensagem</label>
                    <textarea
                        id="message"
                        placeholder="Digite sua mensagem aqui..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label>Números de Telefone</label>
                    <div class="phone-input-group">
                        <input
                            type="tel"
                            id="phone-input"
                            placeholder="+55 11 99999-9999"
                        />
                        <button class="btn-add" id="btn-add-phone">Adicionar</button>
                    </div>
                </div>

                <div class="phone-list" id="phone-list"></div>

                <div class="form-group">
                    <label for="scheduled-at">Agendar Para (opcional)</label>
                    <input
                        type="datetime-local"
                        id="scheduled-at"
                    />
                </div>

                <button class="btn-primary" id="btn-create-campaign">
                    Criar Campanha
                </button>
            </div>

            <!-- Status e Histórico -->
            <div class="card">
                <h2>📊 Status das Campanhas</h2>

                <div class="status-section">
                    <div class="status-card">
                        <h3>Total</h3>
                        <div class="number" id="stat-total">0</div>
                    </div>
                    <div class="status-card">
                        <h3>Enviadas</h3>
                        <div class="number" id="stat-sent">0</div>
                    </div>
                    <div class="status-card">
                        <h3>Falhas</h3>
                        <div class="number" id="stat-failed">0</div>
                    </div>
                    <div class="status-card">
                        <h3>Pendentes</h3>
                        <div class="number" id="stat-pending">0</div>
                    </div>
                </div>

                <div class="campaigns-list" id="campaigns-list">
                    <p style="text-align: center; color: #666;">
                        Nenhuma campanha criada ainda
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
